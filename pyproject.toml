[project]
name = "llm-eval-platform"
version = "0.1.0"
description = "Local LLM evaluation and observability platform"
requires-python = ">=3.11"

[tool.setuptools]
py-modules = []

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["db/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["db", "services", "training"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["db/migrations"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"