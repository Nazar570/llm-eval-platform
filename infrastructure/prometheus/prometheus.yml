global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    platform: llm-eval-platform

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          service: prometheus

  - job_name: rag-app
    metrics_path: /metrics
    static_configs:
      - targets: ["rag-app:8001"]
        labels:
          service: rag-app

  - job_name: eval-consumer
    metrics_path: /metrics
    static_configs:
      - targets: ["eval-consumer:8002"]
        labels:
          service: eval-consumer

  - job_name: drift-detector
    metrics_path: /metrics
    static_configs:
      - targets: ["drift-detector:8003"]
        labels:
          service: drift-detector
  - job_name: pushgateway
    honor_labels: true
    metrics_path: /metrics
    static_configs:
      - targets: [ "pushgateway:9091" ]
        labels:
          service: pushgateway