name: ci

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit pytest==8.2.2 pytest-asyncio==0.23.8 black==26.5.1 ruff==0.15.15 mypy==1.20.2
          pip install torch==2.3.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r training/requirements.txt
          pip install -r services/eval_consumer/requirements.txt
          pip install -r services/rag_app/requirements.txt
          pip install -r services/drift_detector/requirements.txt
          pip install protobuf==3.20.3

      - name: pre-commit
        run: pre-commit run --all-files

      - name: mypy
        run: mypy .

      - name: pytest
        run: pytest
